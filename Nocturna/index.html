<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rueda Nocturna</title>
  <link rel="stylesheet" href="src/output.css" />
</head>
<body class="min-h-screen bg-slate-950 antialiased">

  <main>
    <section class="bg-slate-950 px-6 py-24 text-slate-100">
      <div class="mx-auto w-full max-w-3xl space-y-8">

        <p class="inline-block rounded-full bg-amber-400/10 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-amber-300">
          Nuevo · Jueves a sábado
        </p>

        <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white sm:text-7xl">
          Rueda Nocturna
        </h1>

        <p class="max-w-xl text-lg leading-relaxed text-slate-300">
          Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="flex flex-wrap gap-x-10 gap-y-3">
          <li class="text-xl font-bold text-white">3 rutas</li>
          <li class="text-xl font-bold text-white">Desde $55.000</li>
        </ul>

        <div class="flex flex-wrap gap-4">
          <!-- Botón principal -->
          <a href="#inscripcion"
             class="inline-block rounded-lg bg-amber-400 px-8 py-3 text-base font-semibold text-slate-950 shadow-lg shadow-amber-400/20 hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-950">
            Inscríbete
          </a>

          <!-- Botón secundario -->
          <a href="#rutas"
             class="inline-block rounded-lg bg-slate-800 px-8 py-3 text-base font-semibold text-slate-100 shadow-md hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-950">
            Ver rutas
          </a>

          <!-- Botón de contorno -->
          <a href="#info"
             class="inline-block rounded-lg border-2 border-amber-400 px-8 py-3 text-base font-semibold text-amber-300 hover:bg-amber-400/10 focus:outline-none focus:ring-4 focus:ring-amber-300 focus:ring-offset-2 focus:ring-offset-slate-950">
            Más información
          </a>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
