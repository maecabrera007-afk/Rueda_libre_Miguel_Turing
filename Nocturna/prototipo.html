<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rueda Nocturna · Prototipo</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-slate-950 antialiased">

  <main>
    <section class="bg-slate-950 px-6 py-24 text-slate-100">
      <div class="mx-auto w-full max-w-3xl space-y-8">

        <p class="inline-block rounded-full bg-amber-400/10 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-amber-300">
          Nuevo · Jueves a sábado
        </p>

        <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white sm:text-7xl">
          Rueda Nocturna
        </h1>

        <p class="max-w-xl text-lg leading-relaxed text-slate-300">
          Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="flex flex-wrap gap-x-10 gap-y-3">
          <li class="text-xl font-bold text-white">3 rutas</li>
          <li class="text-xl font-bold text-white">Desde $55.000</li>
        </ul>

        <a href="#reservas"
           class="inline-block rounded-lg bg-amber-400 px-8 py-3 text-base font-semibold text-slate-950 hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-200">
          Inscríbete
        </a>

      </div>
    </section>
  </main>

</body>
</html>
